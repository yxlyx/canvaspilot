name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "scripts/**"
      - "docker-compose.yml"
      - "verify"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "scripts/**"
      - "docker-compose.yml"
      - "verify"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wikibase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wikibase_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/wikibase_test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/wikibase_test
      SESSION_SECRET: test-session-secret-with-at-least-32-bytes
      CANVAS_TOKEN_SECRET: eE-4RX-m39GFpdZXEDBtsaKZoOlMC7EpNlV9XiFrOO8=
      PROVIDER_ENCRYPTION_SECRET: XRoe-9icgC8y3-AtmJVDwhbrRraWTUXCsSu013nHztY=
      CANVAS_BASE_URL: https://canvas.test.example.com
      CANVAS_CLIENT_ID: test-client-id
      CANVAS_CLIENT_SECRET: test-client-secret
      OPENAI_API_KEY: test-openai-key
      FRONTEND_URL: http://localhost:3000
      FAIL_ON_SKIPPED_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install locked backend and verification tools
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Syntax-check shared scripts
        working-directory: .
        run: |
          find verify scripts -type f \( -name '*.sh' -o -name verify \) -print0 | xargs -0 -n1 bash -n
          python -m compileall -q scripts
      - name: Test harness safety modes
        working-directory: .
        run: bash scripts/tests/verify-safety.sh
      - name: Check locked dependencies
        run: python -m pip_audit -r requirements-dev.lock
      - name: Check lint and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Apply database migrations
        run: python -m alembic upgrade head
      - name: Run full test suite with coverage
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=60
