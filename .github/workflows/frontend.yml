name: Frontend CI

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - "verify"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - "verify"
      - ".github/workflows/frontend.yml"

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

env:
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/frontend/.zig-cache-global

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/e2e/package-lock.json
      - name: Cache Zig
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            frontend/.zig-cache
            frontend/.zig-cache-global
          key: ${{ runner.os }}-zig-${{ hashFiles('frontend/build.zig', 'frontend/build.zig.zon', 'frontend/src/**', 'frontend/app/**', 'frontend/api/**', 'frontend/tools/**') }}
          restore-keys: ${{ runner.os }}-zig-
      - name: Check formatting
        run: zig fmt --check build.zig src app api tools
      - name: Build
        run: zig build -Doptimize=ReleaseSafe
      - name: Run Zig tests
        run: zig build test --summary all
      - name: Boot smoke test
        run: |
          ./zig-out/bin/app --host 127.0.0.1 --port 3001 --no-dev --no-dotenv > /tmp/wikibase-boot.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3001/ || true)
            [ "$status" = 200 ] && break
            sleep 0.1
          done
          [ "$status" = 200 ] || { cat /tmp/wikibase-boot.log; exit 1; }
      - name: Run HTTP boundary smoke tests
        run: |
          ./tests/chat-boundary-smoke.sh
          ./tests/m3-live-smoke.sh
      - name: Install browser test dependencies
        working-directory: frontend/e2e
        run: |
          npm ci
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
      - name: Run browser boundary tests
        working-directory: frontend/e2e
        run: npm test
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-boundary-results
          path: |
            frontend/e2e/playwright-report/
            frontend/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  full-stack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wikibase_full_stack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wikibase_full_stack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/wikibase_full_stack_test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/wikibase_full_stack_test
      SESSION_SECRET: full-stack-test-session-secret-32-bytes
      SECURE_COOKIES: "false"
      CANVAS_TOKEN_SECRET: eE-4RX-m39GFpdZXEDBtsaKZoOlMC7EpNlV9XiFrOO8=
      PROVIDER_ENCRYPTION_SECRET: XRoe-9icgC8y3-AtmJVDwhbrRraWTUXCsSu013nHztY=
      CANVAS_BASE_URL: https://canvas.test.example.com
      CANVAS_CLIENT_ID: test-client-id
      CANVAS_CLIENT_SECRET: test-client-secret
      OPENAI_API_KEY: test-openai-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"
      - name: Install locked backend
        working-directory: .
        run: |
          python -m pip install --require-hashes -r backend/requirements.lock
          python -m pip install --no-deps -e ./backend
      - name: Migrate isolated test database
        working-directory: .
        run: |
          python -m scripts.validate_test_database "$TEST_DATABASE_URL"
          cd backend
          python -m alembic upgrade head
      - name: Build frontend
        run: zig build -Doptimize=ReleaseSafe
      - name: Run deterministic full-stack smoke
        working-directory: .
        run: |
          backend_port=$(python -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          frontend_port=$(python -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          while [ "$frontend_port" = "$backend_port" ]; do
            frontend_port=$(python -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          done
          export BACKEND_URL="http://127.0.0.1:$backend_port"
          export FRONTEND_URL="http://127.0.0.1:$frontend_port"
          export WIKIBASE_BACKEND_URL="$BACKEND_URL"
          export WIKIBASE_PUBLIC_ORIGIN="$FRONTEND_URL"
          bash scripts/full-stack-smoke.sh
